name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: |
          echo "🔨 Building project..."
          npm run build || {
            echo "❌ Build failed!"
            exit 1
          }
          echo "✅ Build completed"
          echo ""
          echo "📦 Verifying build output..."
          ls -la dist/ || echo "dist directory not found"
          if [ -d dist/assets ]; then
            echo "📁 Assets directory contents:"
            ls -la dist/assets/ | head -10
          fi
        env:
          NODE_ENV: production
      
      - name: Debug build output
        run: |
          echo "📦 Build output structure:"
          ls -la dist/ || echo "dist directory not found"
          echo ""
          if [ -f dist/index.html ]; then
            echo "📄 index.html exists"
            echo "📄 First 1000 chars of index.html:"
            head -c 1000 dist/index.html
            echo ""
          fi
      
      - name: Fix HTML paths
        run: |
          echo "🔧 Running path fix script..."
          node scripts/fix-paths.mjs
          
          echo ""
          echo "📄 Verifying fixed HTML..."
          cd dist
          echo "=== FULL HTML CONTENT ==="
          cat index.html
          echo ""
          echo "=== Script tags found ==="
          grep -E '<script.*src=' index.html || echo "No script tags"
          echo ""
          echo "=== Checking for /src/main.tsx ==="
          if grep -q '/src/main' index.html; then
            echo "❌ STILL FOUND /src/main.tsx!"
            echo "Attempting emergency fix..."
            sed -i 's|src="/src/main.tsx"|src="/Mapas/assets/main-'$(ls assets/*.js 2>/dev/null | head -1 | sed 's|assets/||' | sed 's|.*/||')'"|g' index.html || echo "Emergency fix failed"
            sed -i 's|src="/src/main|src="/Mapas/src/main|g' index.html
            echo "After emergency fix:"
            grep -E '<script.*src=' index.html || echo "No script tags"
          else
            echo "✅ No /src/main.tsx found!"
          fi
      
      - name: Copy 404.html
        run: cp public/404.html dist/404.html || echo "404.html not found, skipping"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Verify dist contents
        run: |
          echo "📦 Verifying dist contents..."
          ls -la dist/ || exit 1
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html not found!"
            exit 1
          fi
          echo "✅ dist/index.html exists"
          echo "📄 Sample of index.html:"
          head -20 dist/index.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

