name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: |
          echo "🔨 Building project..."
          npm run build || {
            echo "❌ Build failed!"
            exit 1
          }
          echo "✅ Build completed"
        env:
          NODE_ENV: production
      
      - name: Debug build output
        run: |
          echo "📦 Build output structure:"
          ls -la dist/ || echo "dist directory not found"
          echo ""
          if [ -f dist/index.html ]; then
            echo "📄 index.html exists"
            echo "📄 First 1000 chars of index.html:"
            head -c 1000 dist/index.html
            echo ""
          fi
      
      - name: Fix HTML paths
        run: |
          echo "🔧 Running path fix script..."
          if [ -f dist/index.html ]; then
            # Run the Node.js script
            node scripts/fix-paths.mjs
            
            # ALWAYS apply manual fix as backup (even if script succeeds)
            echo ""
            echo "🔧 Applying additional manual fixes..."
            cd dist
            # Fix all absolute paths
            sed -i.bak 's|\(src\|href\)="/\([^"]*\)"|\1="/Mapas/\2"|g' index.html
            sed -i.bak "s|\(src\|href\)='/\([^']*\)'|\1='/Mapas/\2'|g" index.html
            # Fix double Mapas
            sed -i.bak 's|/Mapas/Mapas/|/Mapas/|g' index.html
            # Remove backup
            rm -f index.html.bak
            
            echo ""
            echo "📄 Final verification of fixed HTML..."
            echo "All script src attributes:"
            grep -oE '<script[^>]*src=["'"'"'][^"'"'"']+["'"'"'][^>]*>' index.html || echo "No script tags with src found"
            echo ""
            echo "All link href attributes:"
            grep -oE '<link[^>]*href=["'"'"'][^"'"'"']+["'"'"'][^>]*>' index.html || echo "No link tags with href found"
            echo ""
            echo "Checking for problematic paths (should be empty):"
            grep -oE '(src|href)=["'"'"']/[^M][^"'"'"']+["'"'"']' index.html | grep -v 'Mapas' | grep -v 'http' | head -5 || echo "✅ No problematic paths found!"
          else
            echo "❌ dist/index.html not found!"
            exit 1
          fi
      
      - name: Copy 404.html
        run: cp public/404.html dist/404.html || echo "404.html not found, skipping"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Verify dist contents
        run: |
          echo "📦 Verifying dist contents..."
          ls -la dist/ || exit 1
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html not found!"
            exit 1
          fi
          echo "✅ dist/index.html exists"
          echo "📄 Sample of index.html:"
          head -20 dist/index.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

